[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "object-detection-backend"
version = "0.1.0"
description = "FastAPI backend for live YOLO26 + SAM 3 webcam inference"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "websockets>=13",
    "pydantic>=2.9",
    "numpy>=1.26",
    "pillow>=10.4",
    "opencv-python>=4.10",
    "ultralytics>=8.3",
    "huggingface_hub>=0.26",
    "pycocotools>=2.0.8",
    "insightface>=0.7",
    "onnxruntime-gpu>=1.18",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",
    "ruff>=0.7",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
